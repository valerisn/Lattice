services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://lattice:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/lattice
      APP_URL: ${APP_URL:-http://localhost:3000}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: lattice
      POSTGRES_USER: lattice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lattice -d lattice"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres:
  uploads:
