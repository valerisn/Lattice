name: Verify Lattice
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: ci-database-only
          POSTGRES_DB: lattice_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lattice:ci-database-only@localhost:5432/lattice_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/configure.mjs
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: curl --fail http://localhost:3000/api/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
